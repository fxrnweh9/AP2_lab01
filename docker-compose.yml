version: '3.8'

services:
  order-db:
    image: postgres:15
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"

  payment-db:
    image: postgres:15
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    depends_on:
      order-db:
        condition: service_started
      payment-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DB_URL: "postgres://postgres:pass@order-db:5432/orders_db?sslmode=disable"
      PAYMENT_GRPC_ADDR: "payment-service:50051"
      REDIS_URL: "redis:6379"
    ports:
      - "8080:8080"
      - "50052:50052"

  payment-service:
    build: ./payment-service
    depends_on:
      payment-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: "postgres://postgres:pass@payment-db:5432/payments_db?sslmode=disable"
      GRPC_PORT: "50051"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    ports:
      - "50051:50051"

  notification-service:
    build: ./notification-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      REDIS_URL: "redis:6379"
      PROVIDER_MODE: "SIMULATED"

volumes:
  rabbitmq_data: